<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DeepSeek Harness</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #0f1115; color: #e6e6e6;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
    }
    .card { text-align: center; max-width: 460px; padding: 24px; }
    .logo {
      width: 72px; height: 72px; margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #818cf8, #4338ca);
      box-shadow: 0 8px 30px rgba(79, 70, 229, 0.4);
    }
    .spinner {
      width: 28px; height: 28px; margin: 12px auto 16px;
      border: 3px solid #2a2e3a; border-top-color: #818cf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 17px; font-weight: 600; margin: 0 0 8px; }
    p { font-size: 13px; color: #9aa0ab; margin: 0; line-height: 1.6; }
    .err { color: #fca5a5; }
    .hint { margin-top: 16px; font-size: 12px; color: #6b7280; }
    .titlebar {
      position: fixed; top: 0; left: 0; right: 0; height: 32px;
      display: flex; align-items: center; padding-left: 12px;
      -webkit-app-region: drag; user-select: none;
    }
    .titlebar .app-name { font-size: 12px; color: #6b7280; }
    .titlebar .btn {
      -webkit-app-region: no-drag; margin-left: auto;
      width: 46px; height: 32px; border: none; background: transparent;
      color: #9aa0ab; cursor: pointer; font-size: 16px; line-height: 1;
      display: flex; align-items: center; justify-content: center;
    }
    .titlebar .btn:hover { background: #e81123; color: #fff; }
  </style>
</head>
<body>
  <div class="titlebar">
    <span class="app-name">DeepSeek Harness</span>
    <button class="btn" id="btn-close" title="关闭（最小化到托盘）" aria-label="关闭">&#10005;</button>
  </div>
  <div class="card">
    <div class="logo"></div>
    <div id="spinner" class="spinner"></div>
    <h1 id="title">正在启动 DeepSeek Harness…</h1>
    <p id="status">首次启动需要加载引擎，请稍候。</p>
    <p class="hint">窗口右上角的 × 会最小化到托盘，不会退出程序。</p>
  </div>
  <script>
    document.getElementById('btn-close').addEventListener('click', () => {
      if (window.desktop && typeof window.desktop.close === 'function') window.desktop.close();
    });
    const params = new URLSearchParams(location.search);
    const err = params.get('err');
    if (err) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('title').textContent = '启动失败';
      document.getElementById('status').textContent = decodeURIComponent(err);
      document.getElementById('status').classList.add('err');
    }
  </script>
</body>
</html>
